name: Release

on:
  release:
    types: [published]

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            binary_name: rsc-test-linux-amd64
          - arch: arm64
            platform: linux/arm64
            binary_name: rsc-test-linux-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with TurtleShell (${{ matrix.arch }})
      run: |
        docker run --rm \
          --platform ${{ matrix.platform }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          -e CONAN_HOME=/root \
          docker.io/lnk2past/turtleshell:latest \
          bash -c "
            echo 'Building rsc-tools for ${{ matrix.arch }}...' &&
            export CONAN_HOME=/root &&
            make clean &&
            make &&
            echo 'Build complete'
          "

    - name: Prepare binary for release
      run: |
        # Create release directory
        mkdir -p release
        
        # Copy the built binary
        cp build/src/rsc-test/rsc-test release/${{ matrix.binary_name }}
        
        # Make binary executable
        chmod +x release/${{ matrix.binary_name }}
        
        # Create a simple README for the binary
        cat > release/README.md << EOF
# rsc-test Prebuilt Binary

This is a prebuilt binary for rsc-test tool.

## Usage

Make the binary executable and run:

\`\`\`bash
chmod +x rsc-test-${{ matrix.arch }}
./rsc-test-${{ matrix.arch }} <test-configuration-file> [options]
\`\`\`

## Architecture

This binary is built for: ${{ matrix.arch }}

## Dependencies

This binary requires:
- C++ runtime libraries
- Standard system libraries

## Source Code

The source code is available at: https://github.com/ruc-sci-comp/rsc-tools
EOF

    - name: Create archive
      run: |
        cd release
        tar -czf ../${{ matrix.binary_name }}.tar.gz *

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.binary_name }}
        path: ${{ matrix.binary_name }}.tar.gz

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release body
      id: release_body
      run: |
        cat > release_body.md << 'EOF'
    ## rsc-test Tool Release

    This release includes prebuilt binaries for multiple architectures.

    ### Binaries

    - `rsc-test-linux-amd64.tar.gz` - Linux x86_64 (AMD64) binary
    - `rsc-test-linux-arm64.tar.gz` - Linux ARM64 binary

    ### Usage

    1. Download the appropriate binary for your architecture
    2. Extract: `tar -xzf rsc-test-<arch>.tar.gz`
    3. Make executable: `chmod +x rsc-test-<arch>`
    4. Run: `./rsc-test-<arch> <test-configuration-file> [options]`

    ### Source Code

    The complete source code is available in this repository.

    ### Build Instructions

    To build from source:

    \`\`\`bash
    git clone https://github.com/ruc-sci-comp/rsc-tools.git
    cd rsc-tools
    make
    \`\`\`

    ### Dependencies

    - C++20 compatible compiler
    - CMake 3.20 or later
    - Conan package manager (for dependency management)

    ### Libraries

    - CLI11: Command-line interface parsing
    - nlohmann_json: JSON processing
    - spdlog: Logging framework
    - cpp-subprocess: Cross-platform subprocess execution
    EOF
        echo "body<<EOF" >> $GITHUB_OUTPUT
        cat release_body.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body_path: release_body.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload binaries to release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          artifacts/rsc-test-linux-amd64/rsc-test-linux-amd64.tar.gz
          artifacts/rsc-test-linux-arm64/rsc-test-linux-arm64.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
