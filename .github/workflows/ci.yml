name: CI

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: amd64
            binary_name: rsc-test-linux-amd64
          - arch: arm64
            binary_name: rsc-test-linux-arm64

    container:
      image: docker.io/lnk2past/turtleshell:latest
      options: --platform linux/${{ matrix.arch }} --user root
      entrypoint: /bin/bash

    env:
      CONAN_HOME: /root/.conan2

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean && make

      - name: Package binary
        run: |
          mkdir release
          cp build/src/rsc-test/rsc-test release/${{ matrix.binary_name }}
          chmod +x release/${{ matrix.binary_name }}
          tar -czf ${{ matrix.binary_name }}.tar.gz -C release .

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.binary_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
